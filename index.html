<title>دفتر الأستاذ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='32' rx='27' ry='25' fill='none' stroke='%23d6455d' stroke-width='6'/%3E%3C/svg%3E">
<style>
:root{
  --font:"Segoe UI","SF Arabic","Noto Sans Arabic","Geeza Pro","Dubai",Tahoma,system-ui,sans-serif;
  --bg:#f3f4f9;--surface:#fff;--surface-2:#f8f9fc;--ink:#14213d;--muted:#667089;--line:#e2e6ef;--rule:#dde4f4;
  --brand:#2f4fd8;--on-brand:#fff;--brand-soft:#e9edfd;
  --margin:#d6455d;--margin-soft:rgba(214,69,93,.35);
  --ok:#1b9467;--ok-soft:#e1f4ea;--warn:#b97a06;--warn-soft:#fff2d3;--bad:#d6455d;--bad-soft:#fde8ec;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 14px 30px -18px rgba(20,33,61,.28);
  --side:236px;
}
[data-theme=dark]{
  --bg:#0e1322;--surface:#161d33;--surface-2:#1b2340;--ink:#e8ebf6;--muted:#97a2bd;--line:#273151;--rule:#1c2542;
  --brand:#7e94ff;--on-brand:#0b1022;--brand-soft:#222c55;
  --margin:#ff7186;--margin-soft:rgba(255,113,134,.4);
  --ok:#41c996;--ok-soft:#14352b;--warn:#f0b64a;--warn-soft:#3a2d10;--bad:#ff7186;--bad-soft:#3b1b26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{flex:none}
.muted{color:var(--muted)}
.sm{font-size:13px}
.num-t{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;background:var(--brand);color:var(--on-brand);padding:9px 15px;border-radius:10px;font-weight:700;line-height:1.3;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--brand-soft);filter:none}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger-solid{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:12px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:transparent;border-radius:9px;color:var(--muted)}
.icon-btn:hover{background:var(--brand-soft);color:var(--brand)}
.icon-btn.del:hover{background:var(--bad-soft);color:var(--bad)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea,.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus,.in:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px var(--brand-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions.end{justify-content:flex-end;margin-top:6px}
.error{color:var(--bad);font-size:13px;min-height:22px}

/* ---------- ink mark (the signature element) ---------- */
.ink{display:inline-grid;place-items:center;min-width:3.2em;padding:.15em .6em;border:1.8px solid var(--margin);color:var(--margin);border-radius:52% 48% 50% 50%/60% 54% 46% 42%;font-weight:800;font-variant-numeric:tabular-nums;transform:rotate(-3deg);line-height:1.5}
.ink.dash{border:1.5px dashed var(--line);color:var(--muted);transform:none;font-weight:600}
.ink.lg{font-size:26px;padding:.1em .7em}
.ink.xs{font-size:12px;min-width:2.8em}

/* ---------- lock screen ---------- */
.lock{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;background:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px),var(--bg)}
.lock::before{content:"";position:absolute;inset-block:0;inset-inline-start:clamp(16px,9vw,140px);width:2px;background:var(--margin);opacity:.5}
.lockbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px 28px 26px;width:min(420px,100%);box-shadow:var(--shadow)}
.logo{width:60px;height:56px;display:grid;place-items:center;border:2.6px solid var(--margin);color:var(--margin);border-radius:52% 48% 50% 50%/60% 54% 46% 42%;font-weight:800;font-size:22px;transform:rotate(-5deg);margin-bottom:16px}
.lockbox h1{font-size:24px;margin-bottom:6px}
.lockbox .lead{color:var(--muted);font-size:14px;margin-bottom:20px}
.lockbox .fine{color:var(--muted);font-size:12px;margin-top:14px}

/* ---------- app shell ---------- */
.app{display:none}
.app.on{display:block}
.side{position:fixed;inset-block:0;inset-inline-start:0;width:var(--side);background:var(--surface);border-inline-end:2px solid var(--margin-soft);display:flex;flex-direction:column;padding:22px 14px 16px;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px}
.brand .logo{width:42px;height:40px;font-size:15px;margin:0;border-width:2.2px}
.brand strong{font-size:17px}
.who-me{padding:12px 12px;margin-bottom:16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.who-me b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-me span{font-size:12px;color:var(--muted)}
.nav{display:grid;gap:4px}
.nav button,.side-foot button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:start}
.nav button:hover,.side-foot button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--brand-soft);color:var(--brand)}
.side-foot{margin-top:auto;display:grid;gap:4px}
.savestate{font-size:12px;color:var(--muted);padding:8px 12px 0}
.topbar{display:none}
main{margin-inline-start:var(--side);padding:28px clamp(16px,3vw,44px) 70px}
.wrap{max-width:1120px;margin:0 auto}
@media (max-width:860px){
  .side{inset-block:auto 0;inset-inline:0;width:auto;height:calc(62px + env(safe-area-inset-bottom));flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-inline-end:0;border-top:2px solid var(--margin-soft)}
  .brand,.who-me,.savestate{display:none}
  .nav,.side-foot{display:flex;margin:0;flex:1;gap:2px}
  .nav button,.side-foot button{flex-direction:column;gap:2px;justify-content:center;padding:6px 2px;font-size:11px;text-align:center;flex:1;white-space:nowrap}
  .side-foot{margin:0}
  main{margin:0;padding:12px 14px calc(90px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:15;background:var(--bg);padding:10px 14px;margin:-12px -14px 8px;border-bottom:1px solid var(--line)}
  .topbar .logo{width:34px;height:32px;font-size:12px;border-width:2px;margin:0}
  .topbar b{font-size:14px;display:block;line-height:1.3}.topbar span{font-size:12px;color:var(--muted)}
  .row2{grid-template-columns:1fr}
}

/* ---------- page furniture ---------- */
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb button{border:0;background:none;color:var(--brand);font-weight:700;padding:2px 0}
.titlebar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.titlebar h1{font-size:clamp(22px,3vw,28px);line-height:1.35}
.titlebar p{font-size:14px;margin-top:2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:700;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--brand);color:var(--on-brand)}
.subtabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.subtabs button{border:0;background:none;padding:8px 2px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--margin)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:12px}
.hint{background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:14px}
.empty{text-align:center;padding:36px 18px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty .btn{margin-top:14px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:24px;line-height:1.4;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* section cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.seccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;display:grid;gap:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.seccard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.seccard header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.seccard h3{font-size:18px;line-height:1.4}
.seccard footer{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);margin-top:4px}
.seccard footer .ink{margin-inline-start:auto}
.hello{margin:4px 0 22px}
.hello h1{font-size:clamp(24px,3.4vw,32px);line-height:1.4}

/* lessons list */
.lcard{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .15s}
.lcard:hover{border-color:var(--brand)}
.dateblock{display:grid;place-items:center;width:52px;height:56px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);flex:none;line-height:1.2}
.dateblock b{font-size:20px}.dateblock small{font-size:11px;color:var(--muted)}
.lc-body{display:grid;flex:1;min-width:0}
.lc-body strong{font-size:15px}
.lc-body .c{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-stat{font-size:12.5px;color:var(--muted);text-align:end;flex:none}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.stk,th.stk{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1}
th.stk{background:var(--surface-2)}
tbody tr:hover td.stk{background:var(--surface-2)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.searchbox{position:relative;flex:1;min-width:200px;max-width:340px}
.searchbox .ic{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .in{padding-inline-start:36px}
input.num{width:74px;padding:7px 8px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-variant-numeric:tabular-nums}
input.num:focus,select.ctl:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px var(--brand-soft)}
input.num:disabled{background:var(--surface-2);color:var(--muted)}
select.ctl{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:135px}

/* lesson rows */
.lsum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lrows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .who{flex:1 1 190px;min-width:150px;display:flex;gap:10px;align-items:center}
.lrow .who i{font-style:normal;color:var(--muted);font-size:12px;width:22px;text-align:center}
.lrow .who b{font-size:15px;display:block;line-height:1.35}
.lrow .who small{color:var(--muted)}
.cg{display:grid;gap:4px}
.cl{font-size:11.5px;color:var(--muted);font-weight:700}
.segs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.opt{border:0;background:none;padding:4px 9px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.opt:hover{color:var(--ink)}
.opt:disabled,.dot:disabled{opacity:.4;cursor:default}
.opt.on{background:var(--brand);color:var(--on-brand)}
.opt.on.good{background:var(--ok);color:#fff}
.opt.on.mid{background:var(--warn);color:#fff}
.opt.on.badv{background:var(--bad);color:#fff}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);padding:0}
.dot:hover{border-color:var(--brand)}
.dot.on{background:var(--brand);border-color:var(--brand)}
.cnt{font-size:12px;color:var(--muted);margin-inline-start:6px;font-variant-numeric:tabular-nums}
.lrow .note{flex:1 1 150px;min-width:130px}
.lrow .note input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.lrow .note input:focus{border-color:var(--brand);outline:0}
.lrow .score{margin-inline-start:auto}

/* homework toggles */
.hwb{min-width:94px;padding:6px 10px;border-radius:9px;border:1px solid transparent;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:13px;white-space:nowrap}
.hwb.on{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
th .btn{margin-top:4px;font-weight:600}
/* charts */
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.dist{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px;border-bottom:1px solid var(--line)}
.dcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.dbar{width:100%;max-width:46px;border-radius:7px 7px 0 0;background:var(--brand);min-height:2px}
.dbar.low{background:var(--bad)}
.dcol small{font-size:12px;color:var(--muted)}
.dlabels{display:flex;gap:10px;margin-top:6px}
.dlabels span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.donut{--p:0;width:140px;height:140px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bad-soft) 0)}
.donut span{width:98px;height:98px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:21px;font-weight:800}
.trend svg{width:100%;height:auto;display:block}

/* modal + toast */
.modalback{position:fixed;inset:0;background:rgba(10,16,34,.55);display:none;place-items:center;padding:16px;z-index:60}
.modalback.on{display:grid}
.modal{background:var(--surface);border-radius:18px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modalhead h3{font-size:18px}
.toast{position:fixed;inset-inline:0;bottom:calc(86px + env(safe-area-inset-bottom));margin:auto;width:fit-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.toast.show{opacity:1}
@media (min-width:861px){.toast{bottom:28px;margin-inline-start:calc(var(--side) + 50%);margin-inline-end:auto;transform:translateX(50%)}}
.theme-opts{display:inline-flex;gap:4px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.topbar,.noprint,.tabs,.subtabs,.crumb,.toast,.modalback{display:none!important}
  main{margin:0!important;padding:0!important}
  body{background:#fff;color:#000}
  .tw{overflow:visible;border-color:#bbb}.panel,.kpi{break-inside:avoid;border-color:#bbb}
  [data-theme=dark]{--bg:#fff;--surface:#fff;--surface-2:#f4f4f4;--ink:#000;--muted:#444;--line:#ccc}
}
</style>
</head>
<body>

<section class="lock" id="lock">
  <div class="lockbox">
    <div class="logo" aria-hidden="true">20</div>
    <h1>دفتر الأستاذ</h1>
    <p class="lead" id="lockLead">دفترك الخاص لمتابعة الأقسام والحصص والنتائج. تُشفَّر بياناتك وتبقى على هذا الجهاز.</p>
    <div id="setup">
      <div class="field"><label for="p1">كلمة مرور جديدة</label><input id="p1" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل"></div>
      <div class="field"><label for="p2">تأكيد كلمة المرور</label><input id="p2" type="password" autocomplete="new-password"></div>
    </div>
    <div id="login" hidden>
      <div class="field"><label for="pin">كلمة المرور</label><input id="pin" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور"></div>
    </div>
    <div class="error" id="lockerr" role="alert"></div>
    <button id="go" class="btn block">إنشاء الدفتر</button>
    <p class="fine">لا يمكن استعادة كلمة المرور إذا نسيتها، لذا احتفظ بنسخة احتياطية مشفّرة.</p>
    <p class="fine" id="lockVer"></p>
  </div>
</section>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><div class="logo" aria-hidden="true">20</div><strong>دفتر الأستاذ</strong></div>
    <div class="who-me"><b id="meName">اسم الأستاذ</b><span id="meSub">المادة · الطور</span></div>
    <nav class="nav" aria-label="التنقل الرئيسي">
      <button data-act="nav" data-v="home" data-nav="home" id="navHome"></button>
      <button data-act="nav" data-v="settings" data-nav="settings" id="navSet"></button>
    </nav>
    <div class="side-foot">
      <button data-act="theme" id="themeBtn"></button>
      <button data-act="lock" id="lockBtn"></button>
      <div class="savestate" id="saveState">محفوظ تلقائيًا</div>
    </div>
  </aside>
  <main>
    <div class="topbar"><div class="logo" aria-hidden="true">20</div><div><b id="tbName">دفتر الأستاذ</b><span id="tbSub"></span></div></div>
    <div id="view"></div>
  </main>
</div>

<div class="modalback" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modal"><div class="modalhead"><h3 id="mtitle"></h3><button class="icon-btn" data-act="closeModal" aria-label="إغلاق" id="mclose"></button></div><div id="mbody"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{'use strict';
/* ====================== constants & helpers ====================== */
const APP_VERSION='2026.10.12-d';
const KEY='ledger_sections_cipher_v2',THEME_KEY='ledger_theme_v1';
const TERMS=['الفصل الأول','الفصل الثاني','الفصل الثالث'];
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const ATT={'حاضر':4,'متأخر':3,'مبرر':2,'غائب':0},CON={'جيد':4,'متوسط':2,'سيء':0},NB={'موجود':4,'غير موجود':0};
let db=null,cryptoKey=null,route={page:'home'},saving=Promise.resolve(),lastActive=Date.now(),dlgRes=null;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>String(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
const byId=(arr,id)=>arr.find(x=>String(x.id)===String(id));
const localISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fmt=v=>v===null||v===undefined||Number.isNaN(v)?'—':v.toFixed(2);
const ink=(v,c='')=>`<span class="ink ${v===null||v===undefined?'dash':''} ${c}">${fmt(v)}</span>`;
const fullName=p=>`${p.lastname||''} ${p.firstname||''}`.trim();
const b64=x=>{let s='';new Uint8Array(x).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const un64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));

const I={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
 print:'<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
 back:'<path d="M9 5l7 7-7 7"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
 more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ====================== theme ====================== */
function applyTheme(){
  let t=null;try{t=localStorage.getItem(THEME_KEY)}catch(e){}
  if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;
  const dark=t==='dark';
  $('themeBtn').innerHTML=ic(dark?'sun':'moon',20)+'<span>'+(dark?'الوضع الفاتح':'الوضع الداكن')+'</span>';
  document.querySelector('meta[name=theme-color]').content=dark?'#161d33':'#2f4fd8';
}
function setTheme(t){try{t?localStorage.setItem(THEME_KEY,t):localStorage.removeItem(THEME_KEY)}catch(e){}applyTheme();if(route.page==='settings')drawSettings()}

/* ====================== crypto & storage ====================== */
async function derive(p,salt){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function openPack(pack,k){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(pack.iv)},k,un64(pack.cipher))))}
async function doSave(){
  if(!db||!cryptoKey)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(JSON.stringify(db)));
  localStorage.setItem(KEY,JSON.stringify({salt:db.salt,iv:b64(iv),cipher:b64(cipher)}));
}
function save(){
  setSave('جارٍ الحفظ…');
  saving=saving.then(doSave).then(()=>setSave('محفوظ ✓')).catch(()=>{setSave('تعذّر الحفظ');toast('تعذّر الحفظ: تحقق من مساحة التخزين في المتصفح')});
  return saving;
}
function setSave(t){$('saveState').textContent=t}
function blank(){return {teacher:'',subject:'',stage:'',autolock:10,p10:true,sections:[]}}
function normalize(){
  let ch=false;db.sections||=[];db.autolock??=10;
  db.sections.forEach(s=>{
    s.students||=[];s.lessons||=[];s.grades||=[];s.hw||={};
    s.lessons.forEach(l=>{l.records||={};Object.values(l.records).forEach(r=>{
      if(r.attendance==='غائب'&&!r.prev){r.prev={participation:Array(10).fill(false),conduct:'جيد',notebook:'موجود'};r.participation=Array(10).fill(false);r.conduct='سيء';r.notebook='غير موجود';ch=true}
    })});
    sortStudents(s);
  });
  if(!db.p10){db.sections.forEach(s=>s.grades.forEach(g=>{if(!g.f1&&!g.f2&&!g.exam&&!g.practical)g.practical=10}));db.p10=true;ch=true}
  return ch;
}

/* ====================== calculations ====================== */
const defRec=()=>({attendance:'حاضر',participation:Array(10).fill(false),conduct:'جيد',notebook:'موجود',note:''});
/* الغياب يصفّر باقي المعايير (المشاركة والسلوك والكراس)، ويُسترجع ما كان مسجلًا إن صُحّح الغياب */
function setAtt(r,v){
  const was=r.attendance==='غائب';
  if(v==='غائب'&&!was){r.prev={participation:(r.participation||[]).slice(),conduct:r.conduct,notebook:r.notebook};r.participation=Array(10).fill(false);r.conduct='سيء';r.notebook='غير موجود'}
  else if(v!=='غائب'&&was){const d=r.prev||defRec();r.participation=d.participation;r.conduct=d.conduct;r.notebook=d.notebook;delete r.prev}
  r.attendance=v;
}
const getRec=(l,sid)=>l.records[sid]||defRec();
const ensureRec=(l,sid)=>l.records[sid]||(l.records[sid]=defRec());
const lessonScore=r=>r.attendance==='غائب'?0:(ATT[r.attendance]??0)+((r.participation||[]).filter(Boolean).length*.4)+(CON[r.conduct]??0)+(NB[r.notebook]??0);
const lessonsOf=(s,t)=>s.lessons.filter(l=>l.term===t);
const gradesOf=(s,t)=>s.grades.filter(g=>g.term===t);
const allAbsent=(s,sid,t)=>{const ls=lessonsOf(s,t);return ls.length>0&&ls.every(l=>getRec(l,sid).attendance==='غائب')};
/* الواجبات: أربعة واجبات في الفصل، نقطة لكل واجب منجز (الافتراضي: غير منجز) */
const HW_N=4;
const getHw=(s,t,sid)=>{const a=s.hw?.[t]?.[sid];return Array.from({length:HW_N},(_,i)=>!!(a&&a[i]))};
const hwTotal=(s,t,sid)=>getHw(s,t,sid).filter(Boolean).length;
const ensureHw=(s,t,sid)=>{s.hw||={};s.hw[t]||={};const a=s.hw[t][sid]=getHw(s,t,sid);return a};
/* التقويم /20 = متوسط علامات الحصص (من 16) + نقاط الواجبات (من 4) */
function sessionAssess(s,sid,t){
  if(allAbsent(s,sid,t))return 0;
  const ls=lessonsOf(s,t);
  return (ls.length?avg(ls.map(l=>lessonScore(getRec(l,sid)))):0)+hwTotal(s,t,sid);
}
function gradeOf(s,sid,t){
  const g=gradesOf(s,t).find(x=>String(x.sid)===String(sid));if(!g)return null;
  return allAbsent(s,sid,t)?{...g,f1:0,f2:0,practical:0,exam:0}:g;
}
function termAvg(s,sid,t){
  if(allAbsent(s,sid,t))return 0;
  const g=gradeOf(s,sid,t);if(!g)return null;
  return (sessionAssess(s,sid,t)+Number(g.f1||0)+Number(g.f2||0)+Number(g.practical||0)+Number(g.exam||0))/6;
}
const yearAvg=(s,sid)=>avg(TERMS.map(t=>termAvg(s,sid,t)).filter(v=>v!==null));
const appraisal=v=>v===null?'—':v<7?'نتائج ضعيفة جدًا':v<10?'نتائج ضعيفة':v<12?'نتائج متوسطة':v<13?'نتائج حسنة':v<15?'نتائج جيدة':v<17?'نتائج جيدة جدًا':'نتائج ممتازة';
const guidance=v=>v===null?'—':v<10?'حاول أكثر':v<13?'بإمكانك المزيد':v<15?'واصل':'بوركت';
function stats(s,fn){
  const arr=s.students.map(p=>({p,m:fn(p.id)})),valid=arr.filter(x=>x.m!==null),sorted=valid.slice().sort((a,b)=>b.m-a.m);
  sorted.forEach(x=>x.rank=1+sorted.filter(y=>y.m>x.m+1e-9).length);
  const above=valid.filter(x=>x.m>=10).length;
  return {arr,valid,sorted,avg:avg(valid.map(x=>x.m)),above,below:valid.length-above,hi:sorted[0],lo:sorted[sorted.length-1],pass:valid.length?above/valid.length*100:0};
}
const secAvg=s=>avg(s.students.map(p=>yearAvg(s,p.id)).filter(v=>v!==null));
/* الترتيب الألفبائي العربي: أ ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن هـ و ي */
const ABJAD='ابتثجحخدذرزسشصضطظعغفقكلمنهوي';
const abjadKey=str=>[...String(str||'').replace(/[\u064B-\u0652\u0640]/g,'').trim()].map(c=>{
  c={'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ء':'ا','ى':'ي','ئ':'ي','ؤ':'و','ة':'ه'}[c]||c;
  if(c===' ')return 0;const i=ABJAD.indexOf(c);return i>=0?i+1:100+c.charCodeAt(0)});
function abjadCmp(a,b){const x=abjadKey(a),y=abjadKey(b),n=Math.min(x.length,y.length);for(let i=0;i<n;i++)if(x[i]!==y[i])return x[i]-y[i];return x.length-y.length}
const sortStudents=s=>s.students.sort((p,q)=>abjadCmp(p.lastname,q.lastname)||abjadCmp(p.firstname,q.firstname));

/* ---- charts / reports ---- */
function distChart(vals){
  const B=[[0,5,'0–5'],[5,10,'5–10'],[10,12,'10–12'],[12,14,'12–14'],[14,16,'14–16'],[16,20.01,'16–20']];
  const c=B.map(([a,b])=>vals.filter(v=>v>=a&&v<b).length),mx=Math.max(1,...c);
  return `<div class="dist" role="img" aria-label="توزيع المعدلات">${B.map((b,i)=>`<div class="dcol"><small>${c[i]}</small><div class="dbar ${i<2?'low':''}" style="height:${c[i]/mx*100*.82}%"></div></div>`).join('')}</div><div class="dlabels">${B.map(b=>`<span><bdi>${b[2]}</bdi></span>`).join('')}</div>`;
}

   ${X.map((x,i)=>`<text x="${x}" y="218" text-anchor="middle" font-size="12" fill="var(--muted)">${TERMS[i]}</text>`).join('')}</svg>`;
  const rows=st.sorted.map(x=>`<tr><td>${x.rank}</td><td><b>${esc(fullName(x.p))}</b></td>${TERMS.map(t=>`<td class="num-t">${fmt(termAvg(s,x.p.id,t))}</td>`).join('')}<td>${ink(x.m,'xs')}</td><td>${appraisal(x.m)}</td></tr>`).join('');

/* ====================== csv ====================== */
function downloadCsv(rows,name){
  const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function csvTerm(){
  const s=sec(),t=curTerm(),rows=[['الترتيب','اللقب','الاسم','التقويم /20','فرض1','فرض2','الأعمال التطبيقية /20','الاختبار /40','المعدل /20','التقدير','الإرشاد']];
  const st=stats(s,id=>termAvg(s,id,t));
  st.arr.slice().sort((a,b)=>(b.m??-1)-(a.m??-1)).forEach((x,i)=>{const g=gradeOf(s,x.p.id,t)||{};rows.push([i+1,x.p.lastname,x.p.firstname,sessionAssess(s,x.p.id,t).toFixed(2),g.f1??'',g.f2??'',g.practical??'',g.exam??'',x.m===null?'':x.m.toFixed(2),appraisal(x.m),guidance(x.m)])});
  downloadCsv(rows,`results-${s.name}-${t}.csv`);
}
function csvYear(){
  const s=sec(),rows=[['اللقب','الاسم',...TERMS,'المعدل السنوي','التقدير']];
  s.students.forEach(p=>{const y=yearAvg(s,p.id);rows.push([p.lastname,p.firstname,...TERMS.map(t=>{const v=termAvg(s,p.id,t);return v===null?'':v.toFixed(2)}),y===null?'':y.toFixed(2),appraisal(y)])});
  downloadCsv(rows,`annual-${s.name}.csv`);
}

const FORMS={
  async section(d,f){const id=f.dataset.id;if(id)Object.assign(byId(db.sections,id),d);else db.sections.push({id:uid(),...d,students:[],lessons:[],grades:[]});await save();closeModal();draw(true);toast('تم حفظ القسم')},
  async student(d,f){const s=sec(),id=f.dataset.id;if(id)Object.assign(byId(s.students,id),d);else s.students.push({id:uid(),...d});sortStudents(s);await save();closeModal();draw(true);toast('تم حفظ التلميذ')},
  async bulk(d){
    const s=sec();let n=0;
    d.list.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
      let parts=/[\t,;،]/.test(line)?line.split(/[\t,;،]/).map(x=>x.trim()).filter(Boolean):line.split(/\s+/);
      let gender=d.gender;const gi=parts.findIndex(x=>x==='ذكر'||x==='أنثى'||x==='انثى');
      if(gi>0){gender=parts[gi]==='ذكر'?'ذكر':'أنثى';parts.splice(gi,1)}
      if(parts.length<1)return;
      const lastname=parts[0],firstname=parts.slice(1).join(' ');
      s.students.push({id:uid(),lastname,firstname,gender});n++;
    });
    sortStudents(s);await save();closeModal();draw(true);toast(`تمت إضافة ${n} تلميذ`);
  },
  async lesson(d,f){const s=sec(),id=f.dataset.id;if(id)Object.assign(byId(s.lessons,id),d);else s.lessons.push({id:uid(),term:curTerm(),...d,records:{}});await save();closeModal();draw(true);toast('تم حفظ الحصة')},
  async profile(d){db.teacher=d.teacher;db.subject=d.subject;db.stage=d.stage;db.autolock=Number(d.autolock);await save();updateIdentity();toast('تم الحفظ')},
  async password(d){
    const err=$('perr');err.textContent='';
    try{
      const pack=JSON.parse(localStorage.getItem(KEY));
      try{await openPack(pack,await derive(d.cur,un64(pack.salt)))}catch(e){err.textContent='كلمة المرور الحالية غير صحيحة.';return}
      if(d.n1.length<8){err.textContent='كلمة المرور الجديدة قصيرة (8 أحرف على الأقل).';return}
      if(d.n1!==d.n2){err.textContent='كلمتا المرور غير متطابقتين.';return}
      db.salt=b64(crypto.getRandomValues(new Uint8Array(16)));cryptoKey=await derive(d.n1,un64(db.salt));await save();closeModal();toast('تم تغيير كلمة المرور');
    }catch(e){err.textContent='تعذّر تغيير كلمة المرور.'}
  },
  async wipe(d){if(d.word.trim()!=='مسح')return;const salt=db.salt,al=db.autolock;db=blank();db.salt=salt;db.autolock=al;await save();closeModal();go({page:'home'});toast('تم مسح البيانات')}
};

/* ====================== actions ====================== */
const A={
  nav:t=>go({page:t.dataset.v}),
  openSec:t=>go({page:'section',sid:t.dataset.id,tab:'students'}),
  tab:t=>{route.tab=t.dataset.v;route.sub='lessons';route.lessonId=null;route.q='';draw(false)},
  sub:t=>{route.sub=t.dataset.v;route.lessonId=null;draw(false)},
  openLesson:t=>{route.lessonId=t.dataset.id;draw(false)},
  closeLesson:()=>{route.lessonId=null;draw(false)},
  editSec:t=>secForm(t.dataset.id),
  editStu:t=>stuForm(t.dataset.id),
  bulk:()=>bulkForm(),
  profile:t=>profile(t.dataset.id),
  editLesson:t=>lessonForm(t.dataset.id),
  closeModal:()=>closeModal(),
  dlgOk:()=>{const r=dlgRes;dlgRes=null;closeModal();r&&r(true)},
  dlgNo:()=>closeModal(),
  async delSec(t){const id=t.dataset.id;if(!await ask('حذف القسم','سيُحذف القسم مع كل تلاميذه وحصصه ونتائجه نهائيًا.'))return;db.sections=db.sections.filter(x=>String(x.id)!==String(id));await save();go({page:'home'});toast('تم حذف القسم')},
  async delStu(t){
    const s=sec(),id=t.dataset.id,p=byId(s.students,id);
    if(!await ask('حذف التلميذ',`سيُحذف «${fullName(p)}» مع حضوره ونتائجه في كل الفصول.`))return;
    s.students=s.students.filter(x=>String(x.id)!==String(id));s.grades=s.grades.filter(g=>String(g.sid)!==String(id));Object.values(s.hw||{}).forEach(t=>delete t[id]);s.lessons.forEach(l=>delete l.records[id]);
    await save();draw(true);toast('تم حذف التلميذ');
  },
  async delLesson(t){const s=sec();if(!await ask('حذف الحصة','ستُحذف الحصة مع كل ما سُجّل فيها، وتتغير علامات التقويم تبعًا لذلك.'))return;s.lessons=s.lessons.filter(l=>String(l.id)!==String(t.dataset.id));route.lessonId=null;await save();draw(false);toast('تم حذف الحصة')},
  async rec(t){const l=byId(sec().lessons,t.dataset.l),r=ensureRec(l,t.dataset.sid);if(t.dataset.k==='attendance')setAtt(r,t.dataset.v);else r[t.dataset.k]=t.dataset.v;refreshRow(l,t.dataset.sid);await save()},
  async part(t){const l=byId(sec().lessons,t.dataset.l),r=ensureRec(l,t.dataset.sid),i=+t.dataset.i;r.participation[i]=!r.participation[i];refreshRow(l,t.dataset.sid);await save()},
  async allPresent(t){const s=sec(),l=byId(s.lessons,t.dataset.l);s.students.forEach(p=>setAtt(ensureRec(l,p.id),'حاضر'));await save();draw(true);toast('تم تسجيل الجميع حاضرين')},
  async hw(t){
    const s=sec(),term=curTerm(),a=ensureHw(s,term,t.dataset.sid),i=+t.dataset.i;a[i]=!a[i];
    t.classList.toggle('on',a[i]);t.textContent=a[i]?'منجز':'غير منجز';t.setAttribute('aria-pressed',a[i]);
    t.closest('tr').querySelector('[data-c=t]').innerHTML=`<b>${hwTotal(s,term,t.dataset.sid)}</b> / ${HW_N}`;await save();
  },
  async hwAll(t){
    const s=sec(),term=curTerm(),i=+t.dataset.i,all=s.students.every(p=>getHw(s,term,p.id)[i]);
    s.students.forEach(p=>{ensureHw(s,term,p.id)[i]=!all});await save();draw(true);toast(all?'أُعيدت الخانة إلى «غير منجز»':'تم تحديد الواجب منجزًا للجميع');
  },
  csvTerm,csvYear,
  print:()=>print(),
  theme:()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'),
  setTheme:t=>setTheme(t.dataset.v||null),
  lock:()=>lockApp(),
  backup:()=>{const raw=localStorage.getItem(KEY);if(!raw)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download=`ledger-backup-${localISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('تم تنزيل النسخة الاحتياطية')},
  pickRestore:()=>$('restore').click(),
  chPass:()=>passForm(),
  async refreshApp(){
    try{const rs=(await navigator.serviceWorker?.getRegistrations?.())||[];await Promise.all(rs.map(r=>r.unregister()));const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
    await saving;toast('جارٍ التحديث…');setTimeout(()=>location.reload(),700);
  },
  wipe:()=>modal('مسح كل البيانات',`<form data-form="wipe"><p class="muted" style="margin-bottom:12px">سيُحذف كل شيء نهائيًا. اكتب كلمة «مسح» للتأكيد.</p><div class="field"><input name="word" required autocomplete="off"></div><div class="actions end"><button class="btn danger-solid">مسح نهائي</button></div></form>`)
};
const CH={
  dayFromDate:t=>{const d=new Date(t.value+'T12:00');if(!isNaN(d))t.form.day.value=DAYS[d.getDay()]},
  async note(t){const l=byId(sec().lessons,t.dataset.l);ensureRec(l,t.dataset.sid).note=t.value;await save()},
  async grade(t){
    const s=sec(),term=curTerm(),max=+t.dataset.max;let v=t.value===''?0:Number(t.value);if(!Number.isFinite(v))v=0;v=Math.min(max,Math.max(0,v));t.value=v;
    ensureGrade(s,t.dataset.sid,term)[t.dataset.k]=v;
    const tr=t.closest('tr'),m=termAvg(s,t.dataset.sid,term);
    tr.querySelector('[data-c=m]').innerHTML=ink(m,'xs');tr.querySelector('[data-c=a]').textContent=appraisal(m);tr.querySelector('[data-c=g]').textContent=guidance(m);
    await save();
  },
  async restore(t){
    const f=t.files[0];if(!f)return;
    try{
      const pack=JSON.parse(await f.text()),data=await openPack(pack,cryptoKey);
      if(!await ask('استعادة نسخة','ستُستبدل بياناتك الحالية بمحتوى النسخة. هل تريد المتابعة؟','استعادة',false))return;
      db=data;db.salt=pack.salt;normalize();await save();go({page:'home'});toast('تمت الاستعادة');
    }catch(e){toast('تعذّرت الاستعادة: الملف غير صالح أو كلمة المرور لا تطابق النسخة')}
    finally{t.value=''}
  }
};
const INP={q:t=>{route.q=t.value;const b=$('stbody');if(b)b.innerHTML=stuRows(sec())}};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t&&A[t.dataset.act]){A[t.dataset.act](t,e)}
  else if(e.target===$('modal'))closeModal();
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CH[t.dataset.chg])CH[t.dataset.chg](t,e)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t&&INP[t.dataset.inp])INP[t.dataset.inp](t)});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const fn=FORMS[f.dataset.form];if(fn)fn(Object.fromEntries(new FormData(f)),f);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('modal').classList.contains('on'))closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
});
['pointerdown','keydown','scroll'].forEach(ev=>addEventListener(ev,()=>lastActive=Date.now(),{passive:true}));
setInterval(()=>{if(db){const m=db.autolock??10;if(m>0&&Date.now()-lastActive>m*60000)lockApp()}},15000);

/* ====================== lock / boot ====================== */
function showLock(){
  const has=!!localStorage.getItem(KEY);
  $('setup').hidden=has;$('login').hidden=!has;$('go').textContent=has?'فتح الدفتر':'إنشاء الدفتر';
  $('lockLead').textContent=has?'أدخل كلمة المرور لفتح دفترك.':'دفترك الخاص لمتابعة الأقسام والحصص والنتائج. تُشفَّر بياناتك وتبقى على هذا الجهاز.';
  $('lock').style.display='grid';$('app').classList.remove('on');
  setTimeout(()=>(has?$('pin'):$('p1')).focus(),50);
}
async function lockApp(){
  await saving;closeModal();cryptoKey=null;db=null;route={page:'home'};
  $('view').innerHTML='';$('pin').value='';$('p1').value='';$('p2').value='';$('lockerr').textContent='';showLock();
}
async function unlock(){
  const err=$('lockerr'),btn=$('go'),label=btn.textContent;err.textContent='';
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){err.textContent='المتصفح يمنع حفظ البيانات. افتح الملف في متصفح عادي خارج وضع التصفح الخاص.';return}
  btn.disabled=true;btn.textContent='جارٍ الفتح…';
  try{
    if(raw){
      const pack=JSON.parse(raw);cryptoKey=await derive($('pin').value,un64(pack.salt));db=await openPack(pack,cryptoKey);db.salt=pack.salt;
    }else{
      const p=$('p1').value;
      if(p.length<8)throw Error('كلمة المرور يجب ألا تقل عن 8 أحرف.');
      if(p!==$('p2').value)throw Error('كلمتا المرور غير متطابقتين.');
      db=blank();db.salt=b64(crypto.getRandomValues(new Uint8Array(16)));cryptoKey=await derive(p,un64(db.salt));await save();
    }
    if(normalize())save();lastActive=Date.now();
    $('lock').style.display='none';$('app').classList.add('on');setSave('محفوظ تلقائيًا');go({page:'home'});
  }catch(e){
    cryptoKey=null;db=null;
    err.textContent=raw?'كلمة المرور غير صحيحة أو تعذّر فتح البيانات.':e.message;
  }finally{btn.disabled=false;btn.textContent=label}
}
function boot(){
  $('navHome').innerHTML=ic('home',20)+'<span>الأقسام</span>';
  $('navSet').innerHTML=ic('sliders',20)+'<span>الإعدادات</span>';
  $('lockBtn').innerHTML=ic('lock',20)+'<span>قفل</span>';
  $('mclose').innerHTML=ic('x',18);$('lockVer').textContent='الإصدار '+APP_VERSION;
  applyTheme();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  $('go').onclick=unlock;
  ['pin','p1','p2'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')unlock()}));
  if(!window.crypto||!crypto.subtle){$('lockerr').textContent='هذا المتصفح لا يدعم التشفير المطلوب. استخدم متصفحًا حديثًا.';$('go').disabled=true}
  showLock();
}
boot();
})();
</script>
